<style>
html,body{max-width:100%;overflow-x:hidden}
:root{
  --pm-primary:#2563EB;--pm-primary-hover:#1D4ED8;--pm-primary-subtle:#EFF6FF;
  --pm-surface-base:#f6f7f9;--pm-surface-raised:#ffffff;
  --pm-border-default:#dee2e6;--pm-border-subtle:#e9ecef;
  --pm-text-primary:#1a1d20;--pm-text-secondary:#495057;--pm-text-muted:#94a3b8;
  --pm-success:#10b981;--pm-warning:#f59e0b;
  --pm-radius-control:8px;--pm-radius-container:16px;
  --pm-font-xs:11px;--pm-font-sm:12px;--pm-font-ui:13px;--pm-font-body:14px;--pm-font-kpi:26px;
  --pm-focus:color-mix(in srgb,#2563EB 35%,transparent);
}
*{box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--pm-surface-base);color:var(--pm-text-primary);margin:0}
.text-muted2{color:var(--pm-text-muted)}
.text-sec{color:var(--pm-text-secondary)}
.tnum{font-variant-numeric:tabular-nums}
a{color:var(--pm-primary)}
:where(button,a,select,input,[tabindex]):focus-visible{outline:2px solid var(--pm-focus);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}}

/* shell */
.app{display:flex;min-height:100vh}
.sidebar{width:216px;flex:0 0 216px;background:var(--pm-surface-raised);border-right:1px solid var(--pm-border-subtle);position:sticky;top:0;height:100vh;display:none;flex-direction:column}
@media (min-width:992px){.sidebar{display:flex}}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--pm-surface-raised);border-bottom:1px solid var(--pm-border-subtle);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em}
.brand .logo{height:32px;width:32px;border-radius:var(--pm-radius-control);background:var(--pm-primary);display:flex;align-items:center;justify-content:center;color:#fff}
.navlabel{padding:0 8px 8px;font-size:var(--pm-font-xs);font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--pm-text-muted)}
.navitem{width:100%;display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;border:none;background:none;border-radius:var(--pm-radius-control);font-size:var(--pm-font-body);font-weight:500;color:var(--pm-text-secondary);cursor:pointer;text-align:left}
.navitem:hover{background:#f1f5f9}
.navitem.active{background:var(--pm-primary-subtle);color:#1E40AF}
.navitem .ic{color:var(--pm-text-muted);display:flex}
.navitem.active .ic{color:var(--pm-primary)}

/* cards */
.card2{background:var(--pm-surface-raised);border:1px solid var(--pm-border-subtle);border-radius:var(--pm-radius-container);box-shadow:0 1px 2px rgba(0,0,0,.05);padding:20px}
.card2 .card2-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card2 .card2-title{font-size:var(--pm-font-body);font-weight:600;color:#0f172a}

/* buttons */
.btnx{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border-radius:var(--pm-radius-control);padding:9px 14px;font-size:var(--pm-font-body);font-weight:500;cursor:pointer;border:1px solid transparent;transition:background .12s,color .12s;line-height:1}
.btn-brand{background:var(--pm-primary);color:#fff}
.btn-brand:hover{background:var(--pm-primary-hover)}
.btn-soft{background:#fff;border-color:var(--pm-border-default);color:#334155}
.btn-soft:hover{background:#f8fafc}
.btn-ghost{background:none;color:var(--pm-text-secondary)}
.btn-ghost:hover{background:#f1f5f9}
.btnx:disabled{opacity:.45;cursor:default}

/* chips + pills */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;font-size:var(--pm-font-sm);font-weight:500}
.chip-slate{background:#f1f5f9;color:#475569}
.chip-amber{background:#fffbeb;color:#b45309}
.pill{display:inline-flex;border-radius:999px;padding:2px 8px;font-size:var(--pm-font-sm);font-weight:500}
.pill-on{background:#ecfdf5;color:#047857}.pill-off{background:#fffbeb;color:#b45309}.pill-ic{background:#ede9fe;color:#6d28d9}
.daybadge{display:inline-flex;border-radius:999px;padding:2px 8px;font-size:var(--pm-font-sm);font-weight:500}

/* icon chip */
.ichip{display:inline-flex;align-items:center;justify-content:center;height:36px;width:36px;border-radius:12px}
.ic-indigo{background:var(--pm-primary-subtle);color:var(--pm-primary)}
.ic-amber{background:#fffbeb;color:#d97706}
.ic-emerald{background:#ecfdf5;color:#059669}
.ic-sky{background:#f0f9ff;color:#0284c7}

/* kpi */
.kpi .kpi-label{margin-top:16px;font-size:var(--pm-font-body);color:#64748b}
.kpi .kpi-value{margin-top:4px;font-size:var(--pm-font-kpi);font-weight:600;letter-spacing:-.02em}
.kpi .kpi-sub{margin-top:4px;font-size:var(--pm-font-sm);color:var(--pm-text-muted)}

/* avatar */
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:8px;font-weight:600;flex:0 0 auto}

/* segment bar */
.seg{display:flex;gap:4px;height:16px;width:100%}
.seg>span{border-radius:4px;min-width:4px;cursor:pointer;transition:opacity .12s}
.seg:hover>span{opacity:.4}
.seg>span:hover{opacity:1}
#segtip{position:fixed;z-index:1000;background:#0f172a;color:#fff;font-size:12px;line-height:1.35;padding:6px 10px;border-radius:8px;pointer-events:none;display:none;transform:translate(-50%,-100%);white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#segtip b{font-weight:600}

/* legend + rows */
.legrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:none;border:none;padding:0;width:100%;text-align:left;cursor:pointer}
.legrow .nm{font-size:14px;color:#475569}
.legrow:hover .nm{color:#0f172a}
.comp-toggle button{padding:4px 10px;font-size:var(--pm-font-ui)}
.metric{white-space:nowrap}
.comp-card .v-pct{display:none}
.comp-card.mode-pct .v-val{display:none}
.comp-card.mode-pct .v-pct{display:inline}
.dot{height:10px;width:10px;border-radius:999px;flex:0 0 auto}
.listrow{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;width:100%;text-align:left;background:none;border:none;cursor:pointer}
.listrow:hover{background:#f8fafc}
.rowtitle{font-size:14px;font-weight:500;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowsub{font-size:12px;color:var(--pm-text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.divi>*+*{border-top:1px solid #f1f5f9}

.cov-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.cov-pct{font-size:26px;font-weight:600;line-height:1;letter-spacing:-.02em}
.cov-sub{font-size:12px;color:var(--pm-text-muted);margin-top:2px}

/* segmented control */
.seg-ctl{display:inline-flex;gap:4px;background:#f1f5f9;border-radius:var(--pm-radius-control);padding:4px}
.seg-ctl button{border:none;background:none;border-radius:4px;padding:5px 12px;font-size:var(--pm-font-body);font-weight:500;color:#64748b;cursor:pointer}
.seg-ctl button.on{background:#fff;color:#0f172a;box-shadow:0 1px 2px rgba(0,0,0,.06)}

/* chart wrap */
.chwrap{position:relative;width:100%}

/* links in findings */
.lnk{border:none;background:none;padding:0;color:#0f172a;font-weight:500;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;cursor:pointer}
.lnk:hover{color:var(--pm-primary)}

/* finding cards */
.finding{position:relative;border-radius:12px;padding:12px;border:1px solid}
.f-amber{background:#fffbeb;border-color:#fde68a}
.f-indigo{background:var(--pm-primary-subtle);border-color:#bfdbfe}
.f-rose{background:#fff1f2;border-color:#fecdd3}

/* overlay/modal */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(2,6,23,.5);backdrop-filter:blur(2px);overscroll-behavior:contain}
.ov-card{width:100%;max-width:32rem;background:#fff;border-radius:var(--pm-radius-container);box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:90vh;overflow:auto;overscroll-behavior:contain}
.ov-wide{max-width:min(64rem,94vw)}
.txtbl td,.txtbl th{white-space:nowrap;vertical-align:middle}
.ov-pad{padding:24px}

/* chat */
.chat{background:#fff;border:1px solid var(--pm-border-subtle);border-radius:var(--pm-radius-container);display:flex;flex-direction:column;height:min(560px,78vh);min-width:0;overflow:hidden}
@media(min-width:992px){.chat{height:min(680px,78vh)}}
.chat-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid #f1f5f9}
.chat-body{flex:1;overflow-y:auto;overflow-x:hidden;min-width:0;padding:16px;display:flex;flex-direction:column;gap:12px}
.chat-foot{border-top:1px solid #f1f5f9;padding:12px}
.bub{max-width:85%;min-width:0;border-radius:var(--pm-radius-container);padding:10px 14px;font-size:var(--pm-font-body);line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.rv-card{border:1px solid var(--pm-border-subtle);border-radius:12px;padding:12px 14px}
.dd-wrap{position:relative;display:inline-block}
.dd-menu{position:absolute;top:calc(100% + 6px);right:0;min-width:170px;background:#fff;border:1px solid var(--pm-border-subtle);border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.12);padding:6px;z-index:20}
.dd-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;font-size:var(--pm-font-ui);color:#334155;background:transparent;border:none;border-radius:6px;cursor:pointer}
.dd-item:hover{background:#f1f5f9}
.fmt-toolbar{display:flex;align-items:center;gap:4px;flex-wrap:wrap;background:#f8fafc;border:1px solid var(--pm-border-subtle);border-radius:10px;padding:6px 8px;margin-bottom:14px}
.fmt-select{border:1px solid var(--pm-border-subtle);border-radius:6px;background:#fff;font-size:var(--pm-font-ui);color:#334155;padding:5px 6px;height:30px}
.fmt-sep{width:1px;height:20px;background:var(--pm-border-subtle);margin:0 4px}
.fmt-btn{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border:1px solid transparent;border-radius:6px;background:transparent;color:#334155;cursor:pointer;font-size:var(--pm-font-ui);padding:0 6px}
.fmt-btn:hover{background:#fff;border-color:var(--pm-border-subtle)}
.fmt-btn-text{font-size:12px;min-width:auto;padding:0 8px}
.fmt-color{width:30px;height:30px;padding:2px;border:1px solid var(--pm-border-subtle);border-radius:6px;background:#fff;cursor:pointer}

.followup-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.followup-legend{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 10px;font-size:11px;color:#64748b}
.followup-legend-label{font-weight:600;color:#475569}
.followup-legend-item{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.followup-legend-item .svgico{width:13px;height:13px}
.followup-legend-ai{color:#6d28d9}
.followup-legend-template{color:#64748b}
.followup-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--pm-border-subtle);border-radius:999px;padding:5px 11px;font-size:12px;color:#334155;background:#fff;cursor:pointer}
.followup-chip .svgico{width:13px;height:13px;flex:0 0 auto}
.followup-chip-ai{border-color:#ddd6fe;background:#faf5ff}
.followup-chip-ai:hover{background:#f5f3ff;border-color:#c4b5fd}
.followup-chip-template{background:#fff}
.followup-chip:hover{background:#f8fafc;border-color:#cbd5e1}
.followup-refresh{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:26px;height:26px;border:1px solid var(--pm-border-subtle);border-radius:999px;background:#fff;color:#94a3b8;cursor:pointer;padding:0}
.followup-refresh:hover{color:#334155;border-color:#cbd5e1}
.followup-refresh .svgico{width:13px;height:13px}
.finding-rm{position:absolute;top:8px;right:8px;opacity:0;transition:opacity .12s;padding:3px;border-radius:6px;color:#94a3b8;background:transparent;border:none;cursor:pointer}
.finding:hover .finding-rm{opacity:1}
.finding-rm:hover{color:#e11d48;background:#fff1f2}
.finding-chat{border-left:3px solid var(--pm-primary);background:#f5f7ff}
.finding-chat .fc-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--pm-primary)}
.finding-chat .fc-q{font-size:12px;color:#64748b;font-style:italic;margin:2px 0 8px}
.finding-chat .fc-body{font-size:13px;color:#334155;line-height:1.55}
.finding-chat .fc-body p{margin:0 0 8px}
.finding-chat .fc-body ul,.finding-chat .fc-body ol{margin:0 0 8px;padding-left:20px}
.rv-card.rv-applied{background:#f0fdf4;border-color:#bbf7d0;padding:10px 14px}
.rv-card.rv-rejected{background:#f8fafc;padding:8px 14px}
.rv-group{border:1px solid var(--pm-border-subtle);border-radius:14px;background:#f8fafc;overflow:hidden}
.rv-group-head{display:flex;align-items:center;gap:12px;padding:11px 12px;border-bottom:1px solid var(--pm-border-subtle);background:#fff}
.rv-group-copy{min-width:0;flex:1}
.rv-group-title{font-size:12px;font-weight:700;color:#334155}
.rv-group-desc{font-size:11px;color:#94a3b8;margin-top:1px}
.rv-group-count{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 7px;border-radius:999px;background:#f1f5f9;color:#64748b;font-size:11px;font-weight:600}
.rv-group-body{padding:10px;display:flex;flex-direction:column;gap:8px}
.rv-group .rv-card{background:#fff}
.rv-apply-all{white-space:nowrap;padding:5px 10px!important;font-size:11px!important}
.bub-u{align-self:flex-end;background:var(--pm-primary);color:#fff}
.bub-a{align-self:flex-start;background:#f1f5f9;color:#1e293b}
.bub.md{white-space:normal;max-width:100%;min-width:0}
.md-p{margin:0 0 8px}.md-p:last-child{margin-bottom:0}
.md-h{font-weight:600;margin:10px 0 4px;line-height:1.3}.md-h:first-child{margin-top:0}
.md-h1{font-size:16px}.md-h2{font-size:15px}.md-h3{font-size:14px}.md-h4{font-size:13px}
.bub.md ul.md-l,.bub.md ol.md-l{margin:4px 0 8px;padding-left:20px}
.bub.md ul.md-l li,.bub.md ol.md-l li{margin:2px 0}
.md-tw{overflow-x:auto;margin:6px 0;border-radius:8px}
.ask-callout{display:flex;gap:10px;align-items:flex-start;background:var(--pm-primary-subtle);border:1px solid #c7d2fe;border-left:3px solid var(--pm-primary);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.ask-callout .ac-ico{color:var(--pm-primary);display:flex;margin-top:1px}.ask-callout .ac-ico svg{width:18px;height:18px}
.ask-callout .ac-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--pm-primary)}
.ask-callout .ac-text{font-size:14px;color:#1e293b;margin-top:2px;font-style:italic;line-height:1.45;overflow-wrap:anywhere}
.ask-callout .ac-sub{font-size:12px;color:#64748b;margin-top:4px}
.attach-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 24px;background:#f8fafc;border-bottom:1px solid var(--pm-border-subtle);flex-wrap:wrap}
.attach-memo{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#92400e;white-space:nowrap}
.attach-memo svg{width:13px;height:13px;flex:none}
.web-disclaimer{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.45;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 10px;margin-bottom:10px}
.web-disclaimer svg{width:14px;height:14px;flex:none;margin-top:1px}
.upload-note{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.45;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 10px;margin-top:12px}
.upload-note svg{width:14px;height:14px;flex:none;margin-top:1px}
.filechip{display:inline-flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid var(--pm-border-subtle);border-radius:8px;padding:6px 10px;font-size:var(--pm-font-ui);max-width:100%}
.filechip .fi{display:flex;color:#64748b}.filechip .fi svg{width:16px;height:16px}
.filechip .fn{font-weight:500;color:#334155;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.filechip .fs{color:#94a3b8;font-size:12px;white-space:nowrap}
.filechip .fx{border:none;background:transparent;color:#94a3b8;cursor:pointer;padding:0;display:flex;line-height:0}.filechip .fx svg{width:16px;height:16px}.filechip .fx:hover{color:#e11d48}
.ws-row{min-width:0}
.ws-row>[class*="col-"]{min-width:0}
.bub.md .md-tw{max-width:100%;min-width:0}
.md-tbl{border-collapse:collapse;font-size:var(--pm-font-ui);width:100%}
.md-tbl th,.md-tbl td{border:1px solid var(--pm-border-subtle);padding:4px 8px;text-align:left;white-space:normal;overflow-wrap:break-word}
.md-tbl td[style*="right"],.md-tbl th[style*="right"]{font-variant-numeric:tabular-nums}
.md-tbl th{background:#f8fafc;font-weight:600}
.bub.md code{background:#e2e8f0;padding:1px 5px;border-radius:4px;font-size:12px}
.bub.md strong{font-weight:600}
.starter{display:flex;width:100%;text-align:left;align-items:flex-start;gap:8px;border:1px solid var(--pm-border-subtle);border-radius:8px;padding:8px 12px;font-size:14px;color:#334155;background:#fff;cursor:pointer;margin-top:8px}
.starter:hover{border-color:#bfdbfe;background:var(--pm-primary-subtle)}
.starter .svgico{width:14px;height:14px;flex:0 0 auto;margin-top:2px}
.starter-ai .ai-spark{width:14px;height:14px}
.starter-loading{display:flex;align-items:center;gap:7px;color:#64748b;font-size:12px;margin:8px 0 2px}
.starter-loading .svgico{width:13px;height:13px}

/* report */
.report-page{background:#fff;border:1px solid var(--pm-border-subtle);border-radius:var(--pm-radius-control);box-shadow:0 1px 2px rgba(0,0,0,.05);padding:48px;min-height:60vh;outline:none}
.spin{width:18px;height:18px;border:2px solid #cbd5e1;border-top-color:var(--pm-primary);border-radius:999px;display:inline-block;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
input.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--pm-border-default);border-radius:var(--pm-radius-control);padding:9px 12px;font-size:var(--pm-font-body);color:#0f172a;outline:none;font-family:inherit}
input.inp:focus,select.inp:focus{border-color:var(--pm-primary);box-shadow:0 0 0 4px var(--pm-primary-subtle)}
.lbl{font-size:var(--pm-font-sm);font-weight:500;color:#475569}
@media print{.no-print{display:none!important}.report-page{box-shadow:none;border:none;padding:24px}.content{display:block}.app{display:block}}
.svgico{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
.ai-spark{transform-origin:center;filter:drop-shadow(0 0 2px rgba(124,58,237,.45));animation:aiPulse 2.6s ease-in-out infinite}
@keyframes aiPulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.16);opacity:1}}
.btn-ai-review{transition:box-shadow .18s ease,border-color .18s ease}
.btn-ai-review:hover{box-shadow:0 3px 12px rgba(124,58,237,.28);border-color:#c4b5fd}
</style>
</head>
<body>

const peso=(n)=>new Intl.NumberFormat("en-PH",{style:"currency",currency:"PHP",maximumFractionDigits:0}).format(n||0);
const pesoCompact=(n)=>{const v=n||0;if(v>=1e6)return "\u20b1"+(v/1e6).toFixed(1)+"M";if(v>=1e3)return "\u20b1"+(v/1e3).toFixed(0)+"k";return "\u20b1"+Math.round(v);};
const pct=(n)=>(n||0).toFixed(1)+"%";
const esc=(s)=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const escA=(s)=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;");
function formatNums(t){
 if(t==null)return "";
 try{
  return String(t).replace(/(?<![\d.])\d{4,}(?!\d)/g,function(n){
   if(n.length===4){var y=+n;if(y>=1900&&y<=2099)return n;}
   return n.replace(/\B(?=(\d{3})+(?!\d))/g,",");
  });
 }catch(e){try{console.warn("formatNums failed:",e&&e.message);}catch(_){}return String(t);}
}
function mdInline(t){
 return t
  .replace(/`([^`]+)`/g,'<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
  .replace(/__([^_]+)__/g,'<strong>$1</strong>')
  .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
  .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function mdCells(row){return row.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(c){return c.trim();});}
function mdRender(raw){
 try{
 var lines=esc(String(raw==null?'':raw)).split(/\r?\n/);var out=[];var i=0;
 while(i<lines.length){
  var line=lines[i];
  if(/^\s*\|.*\|\s*$/.test(line)&&i+1<lines.length&&/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1])){
   var headCells=mdCells(line);var sepCells=mdCells(lines[i+1]);i+=2;var bodyRows=[];
   while(i<lines.length&&/\|/.test(lines[i])&&lines[i].trim()!==''){bodyRows.push(mdCells(lines[i]));i++;}
   var aligns=[];for(var ci=0;ci<headCells.length;ci++){var sep=(sepCells[ci]||'').trim();var a='';if(/^:.*:$/.test(sep))a='center';else if(/:$/.test(sep))a='right';else if(/^:/.test(sep))a='left';if(!a){var vals=bodyRows.map(function(r){return (r[ci]||'').trim();}).filter(function(x){return x!=='';});a=(vals.length>0&&vals.every(function(x){return /\d/.test(x)&&!/[A-Za-z]{2,}/.test(x);}))?'right':'left';}aligns.push(a);}
   var th='<tr>'+headCells.map(function(c,ci){return '<th style="text-align:'+aligns[ci]+'">'+mdInline(c)+'</th>';}).join('')+'</tr>';
   var tb=bodyRows.map(function(r){return '<tr>'+r.map(function(c,ci){return '<td style="text-align:'+(aligns[ci]||'left')+'">'+mdInline(c)+'</td>';}).join('')+'</tr>';}).join('');
   out.push('<div class="md-tw"><table class="md-tbl"><thead>'+th+'</thead><tbody>'+tb+'</tbody></table></div>');continue;
  }
  var h=line.match(/^\s*(#{1,4})\s+(.*)$/);
  if(h){out.push('<div class="md-h md-h'+h[1].length+'">'+mdInline(h[2])+'</div>');i++;continue;}
  if(/^\s*[-*]\s+/.test(line)){var it=[];while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){it.push('<li>'+mdInline(lines[i].replace(/^\s*[-*]\s+/,''))+'</li>');i++;}out.push('<ul class="md-l">'+it.join('')+'</ul>');continue;}
  if(/^\s*\d+\.\s+/.test(line)){var io=[];while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){io.push('<li>'+mdInline(lines[i].replace(/^\s*\d+\.\s+/,''))+'</li>');i++;}out.push('<ol class="md-l">'+io.join('')+'</ol>');continue;}
  if(line.trim()===''){i++;continue;}
  var para=[line];i++;
  while(i<lines.length&&lines[i].trim()!==''&&!/^\s*[-*]\s+/.test(lines[i])&&!/^\s*\d+\.\s+/.test(lines[i])&&!/^\s*#{1,4}\s+/.test(lines[i])&&!/^\s*\|.*\|\s*$/.test(lines[i])){para.push(lines[i]);i++;}
  out.push('<p class="md-p">'+para.map(mdInline).join('<br>')+'</p>');
 }
 return out.join('')||'<p class="md-p"></p>';
 }catch(e){try{console.warn('mdRender failed:',e&&e.message);}catch(_){}
  return '<p class="md-p">'+esc(String(raw==null?'':raw))+'</p>';
 }
}

/* ---------------- data generation ---------------- */
function mulberry32(a){return function(){a|=0;a=(a+0x6d2b79f5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function wpick(rng,entries){const tot=entries.reduce((s,e)=>s+e[1],0);let r=rng()*tot;for(const[v,w]of entries){if((r-=w)<=0)return v;}return entries[0][0];}
function generateData(seed=20260901,count=400){
 const rng=mulberry32(seed),rows=[],now=Date.now();
 for(let i=0;i<count;i++){
  let bu,supplier,category,itemName,base,qMin,qMax,relationship,onContract;
  if(rng()<0.14){
   const ic=INTERNAL[Math.floor(rng()*INTERNAL.length)];let b;do{b=wpick(rng,BUS);}while(b===ic.home);
   bu=b;supplier=ic.supplier;category=ic.category;const it=ic.items[Math.floor(rng()*ic.items.length)];itemName=it[0];base=it[1];qMin=it[2];qMax=it[3];
   relationship="Intercompany";onContract=rng()>0.15;
  }else{
   bu=wpick(rng,BUS);const cat=CATALOG[Math.floor(rng()*CATALOG.length)];supplier=wpick(rng,cat.suppliers);category=cat.category;
   const it=cat.items[Math.floor(rng()*cat.items.length)];itemName=it[0];base=it[1];qMin=it[2];qMax=it[3];
   relationship="External";onContract=MAVERICK.has(supplier)?rng()>0.82:rng()>0.18;
  }
  let mult=1+(rng()-0.5)*0.2;
  if(!onContract&&rng()<0.38)mult*=1+rng()*0.55;else if(onContract&&rng()<0.1)mult*=1+rng()*0.15;
  const unitPrice=Math.max(1,Math.round(base*mult));
  const quantity=qMin+Math.floor(rng()*(qMax-qMin+1));
  const d=new Date(now-Math.floor(rng()*365)*86400000);
  rows.push({id:"TX-"+(10000+i),date:d.toISOString().slice(0,10),bu,supplier,category,item:itemName,unitPrice,quantity,amount:unitPrice*quantity,onContract,relationship});
 }
 return rows.sort((a,b)=>(a.date<b.date?1:-1));
}
const sum=(arr,f)=>arr.reduce((s,x)=>s+f(x),0);
function groupSum(rows,key){const m={};for(const r of rows)m[r[key]]=(m[r[key]]||0)+r.amount;return Object.entries(m).map(([name,amount])=>({name,amount})).sort((a,b)=>b.amount-a.amount);}
function deriveContracts(rows,seed=777){
 const rng=mulberry32(seed),m={};
 for(const r of rows){const k=r.supplier+"|"+r.category;(m[k]||(m[k]={supplier:r.supplier,category:r.category,spend:0,bus:new Set()}));m[k].spend+=r.amount;m[k].bus.add(r.bu);}
 return Object.values(m).sort((a,b)=>b.spend-a.spend).slice(0,22).map((p,i)=>{const dl=Math.floor(rng()*360);return{id:"CTR-"+(2600+i),supplier:p.supplier,category:p.category,bus:[...p.bus],annualValue:Math.round(p.spend*(1.4+rng()*0.8)),daysLeft:dl};});
}
function dataSummary(rows){
 var total=sum(rows,function(r){return r.amount;});
 var inter=sum(rows.filter(function(r){return r.relationship==="Intercompany";}),function(r){return r.amount;});
 var off=sum(rows.filter(function(r){return !r.onContract;}),function(r){return r.amount;});
 var byBU=groupSum(rows,"bu").map(function(b){return {bu:b.name,amt:Math.round(b.amount)};});
 var byCat=groupSum(rows,"category").slice(0,10).map(function(c){var list=rows.filter(function(r){return r.category===c.name;});var sup=groupSum(list,"supplier");return {cat:c.name,amt:Math.round(c.amount),topSupplier:sup[0]?sup[0].name:"",topSharePct:c.amount?Math.round(sup[0].amount/c.amount*100):0,suppliers:sup.length};});
 var topSup=groupSum(rows,"supplier").slice(0,10).map(function(sN){var set={};rows.forEach(function(r){if(r.supplier===sN.name)set[r.bu]=1;});return {supplier:sN.name,amt:Math.round(sN.amount),bus:Object.keys(set).length};});
 var bi={};rows.forEach(function(r){var k=r.category+"|"+r.item;(bi[k]||(bi[k]=[])).push(r);});
 var pv=Object.keys(bi).map(function(k){var list=bi[k];var pr=list.map(function(r){return r.unitPrice;});var mn=Math.min.apply(null,pr),mx=Math.max.apply(null,pr);var pp=k.split("|");return {item:pp[1],cat:pp[0],min:mn,max:mx,spreadPct:mn?Math.round((mx-mn)/mn*100):0};}).filter(function(x){return x.spreadPct>8;}).sort(function(a,b){return b.spreadPct-a.spreadPct;}).slice(0,8);
 return {total:Math.round(total),external:Math.round(total-inter),intercompany:Math.round(inter),offContract:Math.round(off),offPct:total?Math.round(off/total*100):0,txns:rows.length,byBU:byBU,byCategory:byCat,topSuppliers:topSup,priceVariance:pv};
}
function supplierOverlap(rows){
 const m={};for(const r of rows){const s=(m[r.supplier]||(m[r.supplier]={spend:0,bus:new Set()}));s.spend+=r.amount;s.bus.add(r.bu);}
 return Object.entries(m).map(([name,v])=>({name,spend:v.spend,buCount:v.bus.size,bus:[...v.bus]})).filter(s=>s.buCount>1).sort((a,b)=>b.spend-a.spend);
}

  const res=await fetch("/api/complete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),signal:ctrl.signal});
  clearTimeout(to);
  const data=await res.json();
  if(!res.ok||data.type==="error"||!Array.isArray(data.content))throw new Error((data&&data.error&&data.error.message)||("Request failed ("+res.status+")"));
  return{text:data.content.filter(b=>b.type==="text").map(b=>b.text).join("\n"),model:(data.model||"AI")};
 }catch(e){
  clearTimeout(to);
  throw (e&&e.name==="AbortError")?new Error("the model did not respond in time"):e;
 }

const ANALYST_RULES="The data spans multiple business units in the group and marks each transaction External or Intercompany (IC, a purchase from another group company such as Company 4 (Packaging), Company 6 (Fuel), or Company 5 (Power)). When assessing external sourcing leverage, separate or flag intercompany spend so group totals are not overstated. Treat a price gap for the same item as a potential sourcing opportunity requiring validation, not a guaranteed saving, since freight, specification, unit of measure, volume, and contract timing can differ. Where useful, highlight suppliers serving more than one business unit and contracts expiring soon. Report figures in pesos (\u20b1) and name business units, suppliers, categories, and items exactly as they appear. Surface evidence; leave the commercial judgment to procurement. Keep answers compact for a narrow side panel: prefer short bullet lists over tables, and if a table is needed keep it to 2-3 columns with brief cells.";
function parseFindings(text){
 var clean=String(text).replace(/```json|```/g,"").trim();
 try{var p=JSON.parse(clean);if(p&&Array.isArray(p.findings))return p.findings;if(Array.isArray(p))return p.filter(function(o){return o&&o.title&&o.detail;});}catch(e){}
 var fm=clean.match(/"findings"\s*:\s*\[[\s\S]*?\]/);
 if(fm){try{var q=JSON.parse("{"+fm[0]+"}");if(q&&Array.isArray(q.findings))return q.findings;}catch(e){}}
 var out=[];var re=/\{[^{}]*"detail"[^{}]*\}/g;var m;
 while((m=re.exec(clean))){try{var o=JSON.parse(m[0]);if(o&&o.title&&o.detail)out.push(o);}catch(e){}}
 return out;
}
function parseAskStarters(text){
 var clean=String(text||"").replace(/```json|```/g,"").trim(),out=null;
 try{var p=JSON.parse(clean);if(p&&Array.isArray(p.askStarters))out=p.askStarters;}catch(e){}
 if(!out){var fm=clean.match(/"askStarters"\s*:\s*\[[\s\S]*?\]/);if(fm){try{var q=JSON.parse("{"+fm[0]+"}");if(q&&Array.isArray(q.askStarters))out=q.askStarters;}catch(e){}}}
 return (out||[]).map(function(q){return String(q||"").trim();}).filter(Boolean).slice(0,6);
}
async function runAnalysis(a){
 const system="You are a procurement spend analyst for a large diversified group, writing findings for a procurement head the way a sharp analyst would write them into a memo for their own boss, not a compressed data label. You are limited to the authorized data provided below and must not reference anything outside it. "+ANALYST_RULES+" Write each finding as flowing, professional report prose, not a terse compressed fragment.";
 const userMsg="Authorized scope: "+a.dataScope+" | Period: "+a.timeLabel+" ("+a.count+" transactions, "+peso(a.total)+" total spend).\nFocus areas: "+a.focusLabels+".\nAggregated summary over all authorized rows (amounts in PHP):\n"+JSON.stringify(dataSummary(a.rows))+"\nSample transactions (bu=business unit, oc=on contract, u=unit price, q=quantity, rel=EXT external / IC intercompany):\n"+JSON.stringify(compactRows(a.rows))+"\nContracts JSON (av=annual value, dl=days until expiry):\n"+JSON.stringify(compactContracts(a.contracts))+filesContext()+'\n\nReturn at most 4 findings, most important first. Write each \"detail\" as a genuine paragraph of 2 to 4 full sentences in a professional business-report tone, the way a procurement head would brief their own boss in writing: state what was found with specific figures and exact names, explain briefly why it matters or what risk or opportunity it represents, and where it fits naturally, note what is worth validating or watching next. Do not just restate the metric in one dense clause, write connected prose a person would actually want to read. For EACH finding also generate exactly 4 short follow-up questions in \"followUps\". These must be specific to that finding and its evidence, not generic prompts. Use the card context to help the procurement head investigate, validate, compare, quantify, or decide what to do next. Keep each question concise (ideally 12 words or fewer) and answerable from the authorized dataset where possible. Also generate exactly 6 short "askStarters" for the Ask Your Data panel. These should use the overall authorized scope and the most material patterns you found, not simply repeat the per-card follow-ups. They should help the procurement head quantify, compare, investigate, or prioritize the next question. Return ONLY valid JSON, no markdown fences, shaped as:\n{"findings":[{"area":"off-contract|concentration|price-variance|cross-bu|leverage","title":"short label","severity":"low|medium|high","detail":"a 2 to 4 sentence paragraph in report prose, with specific figures and exact names, explaining the finding and why it matters","metric":"one headline number, e.g. \u20b1420k or 63%","followUps":["context-specific question 1?","context-specific question 2?","context-specific question 3?","context-specific question 4?"]}],"askStarters":["scope-specific question 1?","scope-specific question 2?","scope-specific question 3?","scope-specific question 4?","scope-specific question 5?","scope-specific question 6?"]}';
 const {text,model}=await completeAI(system,[{role:"user",content:userMsg}],false,1800);
 const findings=parseFindings(text);
 const askStarters=parseAskStarters(text);
 findings.forEach(function(f){
  if(Array.isArray(f.followUps)){
   f.followUps=f.followUps.map(function(q){return String(q||"").trim();}).filter(Boolean).slice(0,4);
   if(f.followUps.length>=2)f._fuSource="ai";else delete f.followUps;
  }
 });
 return{findings,model,askStarters};
}

function localAnalysis(rows,picked){
 const total=sum(rows,r=>r.amount);const money=(n)=>peso(Math.round(n));const findings=[];
 if(picked.includes("off")){const off=rows.filter(r=>!r.onContract);const ot=sum(off,r=>r.amount);const bs=groupSum(off,"supplier").slice(0,3);
  findings.push({area:"off-contract",title:"Off-contract spend",severity:total&&ot/total>0.15?"high":"medium",detail:money(ot)+" ("+pct(total?ot/total*100:0)+" of spend) ran outside contracts across "+off.length+" transactions"+(bs.length?", concentrated in "+bs.map(x=>x.name+" ("+pesoCompact(x.amount)+")").join(", "):"")+". Worth checking whether these belong on a contract.",metric:pct(total?ot/total*100:0)});}
 if(picked.includes("conc")){const byCat={};rows.forEach(r=>(byCat[r.category]||(byCat[r.category]=[])).push(r));
  const res=Object.entries(byCat).map(([cat,list])=>{const ct=sum(list,r=>r.amount);const sup=groupSum(list,"supplier");return{cat,top:sup[0]?sup[0].name:"",share:ct?sup[0].amount/ct*100:0,n:sup.length};}).sort((a,b)=>b.share-a.share);
  const fl=res.filter(r=>r.share>=55).slice(0,3);
  if(fl.length)findings.push({area:"concentration",title:"Category concentration",severity:"medium",detail:fl.map(f=>"In "+f.cat+", "+f.top+" holds "+pct(f.share)+" of spend ("+f.n+" suppliers)").join("; ")+". High single-supplier share can weaken leverage at renewal.",metric:pct(fl[0].share)});
  else if(res.length)findings.push({area:"concentration",title:"Category concentration",severity:"low",detail:"No category has a single supplier above 55%. Most concentrated is "+res[0].cat+" at "+pct(res[0].share)+".",metric:pct(res[0].share)});}
 if(picked.includes("var")){const byItem={};rows.forEach(r=>(byItem[r.category+"|"+r.item]||(byItem[r.category+"|"+r.item]=[])).push(r));
  const res=Object.entries(byItem).map(([k,list])=>{const parts=k.split("|");const pr=list.map(r=>r.unitPrice);const min=Math.min.apply(null,pr),max=Math.max.apply(null,pr);return{item:parts[1],category:parts[0],min,max,spread:min?(max-min)/min*100:0,over:sum(list,r=>(r.unitPrice-min)*r.quantity),buys:list.length};}).filter(r=>r.buys>=2&&r.spread>8).sort((a,b)=>b.over-a.over).slice(0,3);
  if(res.length)findings.push({area:"price-variance",title:"Comparable price variance",severity:"high",detail:res.map(v=>v.item+" ("+v.category+"): "+money(v.min)+"\u2013"+money(v.max)+" per unit, a "+pct(v.spread)+" spread, about "+money(v.over)+" above the lowest observed price").join("; ")+". A potential sourcing opportunity requiring validation (freight, spec, volume may differ).",metric:money(res[0].over)});
  else findings.push({area:"price-variance",title:"Comparable price variance",severity:"low",detail:"Unit prices look consistent across repeat buys in this window.",metric:"under 8%"});}
 if(picked.includes("lev")){const ov=supplierOverlap(rows).slice(0,3);
  if(ov.length)findings.push({area:"leverage",title:"Cross-BU supplier leverage",severity:"medium",detail:ov.map(s=>s.name+" serves "+s.buCount+" BUs for "+pesoCompact(s.spend)+" group spend").join("; ")+". Consolidating these could improve negotiating leverage.",metric:ov.length+" suppliers"});}
 return{findings,model:"computed locally"};
}

function uniqueStrings(xs){
 return Array.from(new Set((xs||[]).map(function(x){return String(x||"").trim();}).filter(Boolean))).sort(function(a,b){return b.length-a.length;});
}
function escapeRe(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function sanitizeWebQuery(q,ctx){
 var s=String(q||"").replace(/\s+/g," ").trim();
 var rows=(ctx&&ctx.rows)||[],contracts=(ctx&&ctx.contracts)||[];
 // Strip exact internal organizational and supplier names known to the authorized dataset.
 var sensitive=uniqueStrings(
  rows.map(function(r){return r.bu;})
   .concat(rows.map(function(r){return r.supplier;}))
   .concat(contracts.map(function(c){return c.supplier;}))
 );
 sensitive.forEach(function(name){
  if(name.length<3)return;
  s=s.replace(new RegExp(escapeRe(name),"ig")," public-market ");
 });
 // Strip explicit currency, percentages, and large internal-looking figures while keeping years/model numbers.
 s=s.replace(/(?:₱|PHP|Php|php|\$|USD)\s*[\d,.]+(?:\s*[kKmMbB])?/g," ");
 s=s.replace(/\b\d+(?:\.\d+)?\s*%/g," ");
 s=s.replace(/\b(?!19\d{2}\b|20\d{2}\b)\d{4,}(?:[,.]\d+)*\b/g," ");
 // Remove phrases that try to carry internal state into the external request.
 s=s.replace(/\b(our|ours|we paid|we pay|internal|in our data|our contract|our spend|our supplier|our price|our rate)\b/ig," ");
 s=s.replace(/\s+/g," ").trim();
 if(!s)s="current public market benchmark and pricing information";
 return s.slice(0,420);
}
function parsePublicEvidence(text){
 var clean=String(text||"").replace(/```json|```/g,"").trim(),p=null;
 try{p=JSON.parse(clean);}catch(e){
  var m=clean.match(/\{[\s\S]*\}/);
  if(m){try{p=JSON.parse(m[0]);}catch(_){}}
 }
 if(!p||typeof p!=="object")return null;
 var benchmarks=Array.isArray(p.benchmarks)?p.benchmarks:[];
 var sources=Array.isArray(p.sources)?p.sources:[];
 benchmarks=benchmarks.slice(0,8).map(function(b){
  var lo=(b&&b.low!=null)?Number(b.low):null,hi=(b&&b.high!=null)?Number(b.high):null;
  if(lo!=null&&!isFinite(lo))lo=null;if(hi!=null&&!isFinite(hi))hi=null;
  if(lo!=null&&hi==null)hi=lo;if(hi!=null&&lo==null)lo=hi;
  return {label:String((b&&b.label)||""),low:lo,high:hi,currency:String((b&&b.currency)||""),unit:String((b&&b.unit)||""),source:String((b&&b.source)||""),sourceUrl:String((b&&b.sourceUrl)||""),asOf:String((b&&b.asOf)||"")};
 }).filter(function(b){return b.label||b.low!=null||b.high!=null;});
 sources=sources.slice(0,8).map(function(s){return{name:String((s&&s.name)||""),url:String((s&&s.url)||""),note:String((s&&s.note)||"")};}).filter(function(s){return s.name||s.url;});
 return {publicSummary:String(p.publicSummary||"").trim(),benchmarks:benchmarks,sources:sources};
}
function webMatchRows(q,ctx){
 var rows=(ctx&&ctx.rows)||[],ql=String(q||"").toLowerCase();
 if(!rows.length)return {rows:[],label:""};
 var items=uniqueStrings(rows.map(function(r){return r.item;}));
 var cats=uniqueStrings(rows.map(function(r){return r.category;}));
 var item=items.find(function(x){return x.length>2&&ql.indexOf(x.toLowerCase())>=0;});
 if(item)return {rows:rows.filter(function(r){return r.item===item;}),label:item};
 var cat=cats.find(function(x){return x.length>2&&ql.indexOf(x.toLowerCase())>=0;});
 if(cat)return {rows:rows.filter(function(r){return r.category===cat;}),label:cat};
 // Token-score fallback lets "laptop pricing" match "Laptop 14in" without sending local data externally.
 var toks=ql.replace(/[^a-z0-9]+/g," ").split(/\s+/).filter(function(x){return x.length>=4;});
 var best="",score=0,isItem=true;
 items.concat(cats).forEach(function(x,idx){
  var xl=x.toLowerCase(),sc=toks.reduce(function(n,t){return n+(xl.indexOf(t)>=0?1:0);},0);
  if(sc>score){score=sc;best=x;isItem=idx<items.length;}
 });
 if(score>0&&best)return {rows:rows.filter(function(r){return isItem?r.item===best:r.category===best;}),label:best};
 return {rows:[],label:""};
}
function fmtExternalSource(s){
 var nm=(s.name||s.url||"Public source").trim(),note=(s.note||"").trim();
 return "- "+nm+(note?": "+note:"")+(s.url?" ("+s.url+")":"");
}
function localWebComparison(q,evidence,ctx,safeQuery){
 var out=[];
 out.push("**External evidence**");
 out.push(evidence.publicSummary||"Public sources were retrieved, but they did not return a concise summary.");
 if(evidence.sources&&evidence.sources.length){
  out.push("");
  out.push("Sources:");
  evidence.sources.slice(0,5).forEach(function(s){out.push(fmtExternalSource(s));});
 }
 var match=webMatchRows(q,ctx),rows=match.rows||[];
 out.push("");
 out.push("**Your data (local only)**");
 if(!rows.length){
  out.push("No authorized internal item or category could be confidently matched to this search, so Spend Master did not combine the web result with internal transaction values.");
 }else{
  var qty=sum(rows,function(r){return Number(r.quantity)||0;}),amt=sum(rows,function(r){return Number(r.amount)||0;});
  var wavg=qty?amt/qty:sum(rows,function(r){return Number(r.unitPrice)||0;})/Math.max(rows.length,1);
  var prices=rows.map(function(r){return Number(r.unitPrice)||0;}).filter(function(n){return n>0;});
  var mn=prices.length?Math.min.apply(null,prices):0,mx=prices.length?Math.max.apply(null,prices):0;
  out.push(match.label+": "+rows.length+" authorized transaction"+(rows.length===1?"":"s")+", "+peso(amt)+" spend"+(prices.length?", observed unit price "+peso(mn)+(mx!==mn?(" to "+peso(mx)):"")+", weighted average "+peso(Math.round(wavg)):"")+".");
  out.push("");
  out.push("**Local comparison**");
  var php=(evidence.benchmarks||[]).filter(function(b){return /^(php|₱|peso|philippine)/i.test(String(b.currency||""))&&b.low!=null&&b.high!=null;});
  if(php.length&&prices.length){
   var b=php[0],mid=(b.low+b.high)/2,diff=mid?((wavg-mid)/mid*100):0;
   var pos=wavg>b.high?"above":wavg<b.low?"below":"within";
   out.push("Public benchmark for "+(b.label||match.label)+": "+peso(Math.round(b.low))+(b.high!==b.low?(" to "+peso(Math.round(b.high))):"")+(b.unit?(" "+b.unit):"")+". The local weighted average of "+peso(Math.round(wavg))+" is **"+pos+"** that range"+(pos==="within"?"":", about "+Math.abs(diff).toFixed(1)+"% "+(diff>0?"above":"below")+" the benchmark midpoint")+".");
   out.push("Treat this as a benchmark signal, not a confirmed saving. Specification, freight, volume, unit of measure, taxes, service levels, and contract timing should be validated before procurement action.");
  }else{
   out.push("The public evidence did not provide a clean PHP numeric benchmark that can be safely compared with the matched internal unit prices. The external evidence and internal values are shown separately rather than forcing a misleading variance.");
  }
 }
 out.push("");
 out.push("_Privacy boundary: only the sanitized public search query was sent externally. Internal transactions, prices, spend, contracts, findings, uploaded files, and the local comparison remained inside Spend Master._");
 out.push("_External search query: “"+safeQuery.replace(/"/g,"'")+"”_");
 return out.join("\n");
}

function localChatAnswer(q,ctx){
 const t=String(q).toLowerCase();const rows=ctx.rows||[];const contracts=ctx.contracts||[];const total=sum(rows,r=>r.amount);const money=n=>peso(Math.round(n));
 if(/expir|expire|expiry|renew/.test(t)){const exp=contracts.filter(c=>c.daysLeft<=90).sort((a,b)=>b.annualValue-a.annualValue).slice(0,5);if(!exp.length)return "No contracts expire within 90 days in this scope.";return "Contracts expiring within 90 days, by annual value:\n"+exp.map(c=>"- "+c.supplier+" ("+c.category+"): "+money(c.annualValue)+"/yr, "+c.daysLeft+" days left").join("\n");}
 if(/supplier/.test(t)&&/(more than one|multiple|several|across|overlap|shared|two or more)/.test(t)){const ov=supplierOverlap(rows).slice(0,6);if(!ov.length)return "No supplier spans more than one business unit in this scope.";return "Suppliers serving more than one business unit:\n"+ov.map(s=>"- "+s.name+": "+s.buCount+" BUs, "+money(s.spend)+" group spend").join("\n");}
 if(/(price|comparable|variance|cheaper|expensive|paying more)/.test(t)){const bi={};rows.forEach(r=>(bi[r.category+"|"+r.item]||(bi[r.category+"|"+r.item]=[])).push(r));const res=Object.entries(bi).map(([k,list])=>{const pp=k.split("|");const pr=list.map(r=>r.unitPrice);const mn=Math.min.apply(null,pr),mx=Math.max.apply(null,pr);return{item:pp[1],cat:pp[0],mn,mx,spread:mn?(mx-mn)/mn*100:0,over:sum(list,r=>(r.unitPrice-mn)*r.quantity),n:list.length};}).filter(r=>r.n>=2&&r.spread>8).sort((a,b)=>b.over-a.over).slice(0,5);if(!res.length)return "Unit prices look consistent across repeat buys in this scope.";return "Widest comparable price spreads (potential sourcing opportunities, needs validation):\n"+res.map(v=>"- "+v.item+" ("+v.cat+"): "+money(v.mn)+" to "+money(v.mx)+" per unit, "+v.spread.toFixed(1)+"% spread, ~"+money(v.over)+" above lowest").join("\n");}
 if(/(off.?contract|outside contract|maverick|leakage)/.test(t)){const off=rows.filter(r=>!r.onContract);const ot=sum(off,r=>r.amount);const bs=groupSum(off,"supplier").slice(0,5);return "Off-contract spend: "+money(ot)+" ("+(total?pct(ot/total*100):"0%")+") across "+off.length+" transactions. Top: "+bs.map(x=>x.name+" ("+pesoCompact(x.amount)+")").join(", ")+".";}
 if(/(top supplier|biggest supplier|largest supplier|which supplier)/.test(t)){const ts=groupSum(rows,"supplier").slice(0,6);return "Top suppliers by spend:\n"+ts.map(s=>"- "+s.name+": "+money(s.amount)).join("\n");}
 if(/(by business unit|by bu|per business unit|per bu|which bu|which business unit)/.test(t)){const bu=groupSum(rows,"bu");return "Spend by business unit:\n"+bu.map(b=>"- "+b.name+": "+money(b.amount)+" ("+(total?pct(b.amount/total*100):"0%")+")").join("\n");}
 if(/(total spend|how much.*(spend|spent)|overall spend)/.test(t)){const inter=sum(rows.filter(r=>r.relationship==="Intercompany"),r=>r.amount);return "Total spend in scope: "+money(total)+" ("+money(total-inter)+" external, "+money(inter)+" intercompany).";}
 return null;
}
async function chatSend(text){
 const inp=document.getElementById("chatInput");
 const q=(text!=null?text:(inp?inp.value:"")||"").trim();
 if(!q||chat.busy)return;
 chat.msgs.push({role:"user",content:q,web:chat.web});chat.busy=true;chat.lastQ=q;renderChat();
 try{
  // Your Data mode can use recent conversation history. Web search is handled separately
  // below and NEVER sends chat history externally, because prior replies can contain local
  // comparison results and internal values.
  var HIST_CAP=12, CHAR_BUDGET=6000;
  var modeMsgs=chat.msgs.filter(function(m){return m.web===chat.web;});
  if(modeMsgs.length>HIST_CAP)modeMsgs=modeMsgs.slice(modeMsgs.length-HIST_CAP);
  var total=0,kept=[];
  for(var mi=modeMsgs.length-1;mi>=0;mi--){
   var len=String(modeMsgs[mi].content||"").length;
   if(kept.length>0 && total+len>CHAR_BUDGET)break;
   kept.unshift(modeMsgs[mi]); total+=len;
  }
  if(chat.web){
   // Web search is deliberately stateless externally: chat history can contain local
   // comparison results, so ONLY the current sanitized query is sent to the web provider.
   var wr=await retrievePublicEvidence(q,chat.ctx);
   var reply=localWebComparison(q,wr.evidence,chat.ctx,wr.safeQuery);
   chat.msgs.push({role:"assistant",content:reply,web:true,webEvidence:true,webModel:wr.model});
  }else{
   const modeHistory=kept.map(m=>({role:m.role,content:m.content}));
   const {text:reply}=await completeAI(chatBaseSystem(chat.ctx),modeHistory,false);
   chat.msgs.push({role:"assistant",content:reply,web:false});
  }
 }catch(e){
  try{console.warn("model call failed:",(e&&e.message)||e);}catch(_){}
  if(chat.web){
   var head=(e&&e.noKey)?"Web search is not available right now.":"The public web search service did not return usable evidence.";
   chat.msgs.push({role:"assistant",content:head+" No internal procurement data was sent as part of the failed search. You can try again with a public item, category, supplier, or market benchmark.",web:true});
  }else{
   var head=(e&&e.noKey)?"AI assistance is not available right now.":"We reached the AI service but it did not return an answer.";
   var la=localChatAnswer(q,chat.ctx);
   var body=la?(" Here is what your data shows:\n\n"+la):" You can answer from your data instead, try: contracts expiring soon, suppliers serving multiple BUs, price variance, off-contract spend, top suppliers, or spend by business unit.";
   chat.msgs.push({role:"assistant",content:head+body,offerLocal:!la,web:false});
  }
 }
 try{chat.busy=false;renderChat();}
 catch(e){try{console.warn("post-response render failed:",e&&e.message);}catch(_){}chat.busy=false;try{renderChat();}catch(_){}}
}

/* attachments */
function humanSize(b){if(b<1024)return b+" B";if(b<1048576)return (b/1024).toFixed(0)+" KB";return (b/1048576).toFixed(1)+" MB";}
function isTextFile(f){return /\.(csv|tsv|txt|md|json|log|xml|ya?ml)$/i.test(f.name)||/^text\//.test(f.type||"")||f.type==="application/json";}
function addFiles(list,cb){var arr=Array.prototype.slice.call(list||[]);var pending=arr.length;if(!pending){cb&&cb();return;}
 arr.forEach(function(f){var rec={id:"f"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:f.name,size:f.size,type:f.type||"",text:""};
  if(isTextFile(f)&&f.size<=200000){var rd=new FileReader();rd.onload=function(){rec.text=String(rd.result||"").slice(0,4000);state.files.push(rec);if(--pending===0)cb&&cb();};rd.onerror=function(){state.files.push(rec);if(--pending===0)cb&&cb();};rd.readAsText(f);}
  else{state.files.push(rec);if(--pending===0)cb&&cb();}});}
function removeFile(id){state.files=state.files.filter(function(f){return f.id!==id;});}
function removeFinding(idx){state.analysis.findings=state.analysis.findings.filter(function(_,i){return i!==idx;});}
function fileChip(f,act){return '<span class="filechip"><span class="fi">'+IC.file+'</span><span class="fn">'+esc(f.name)+'</span><span class="fs">'+humanSize(f.size)+'</span><button class="fx" data-action="'+act+'" data-id="'+f.id+'" title="Remove" aria-label="Remove file">'+IC.x+'</button></span>';}
function filesContext(){if(!state.files.length)return "";var budget=2500;var body=state.files.map(function(f){var line="- "+f.name+" ("+(f.type||"file")+", "+humanSize(f.size)+")";if(f.text&&budget>0){var ex=f.text.slice(0,budget);budget-=ex.length;line+=":\n"+ex;}return line;}).join("\n");return "\nUser-attached files for additional context ("+state.files.length+"):\n"+body+"\nUse these as supplementary context; if a file is not relevant to the question, ignore it.\n";}

function wizRun(){
 const token=++wizRunToken;
 wiz.step=3;wiz.progress=8;wiz.msg=0;renderWizard();
 const filtered=wizFiltered();const total=sum(filtered,r=>r.amount);const ds=dataScopeLabel(role());const tl=wizTimeLabel();
 const usePicked=wiz.picked.length?wiz.picked.slice():["off","conc","var"];const note=(wiz.note||"").trim();
 const base={findings:[],model:"",timeLabel:tl,dataScope:ds,count:filtered.length,total,rows:filtered,contracts:state.contracts,picked:usePicked,note:note};
 if(filtered.length===0){state.analysis=Object.assign(base,{count:0,total:0,rows:[]});closeModal();state.view="workspace";render();return;}
 clearInterval(wiz.timer);clearInterval(wiz.mtimer);
 wiz.timer=setInterval(()=>{wiz.progress=Math.min(92,wiz.progress+3+Math.random()*5);const bar=modalRoot.querySelector('[style*="var(--pm-primary);width"]');if(bar)bar.style.width=wiz.progress+"%";},150);
 wiz.mtimer=setInterval(()=>{wiz.msg=Math.min(LOADING_MSGS.length-1,wiz.msg+1);renderWizard();},520);
 runAnalysis({rows:filtered,contracts:state.contracts,timeLabel:tl,dataScope:ds,focusLabels:usePicked.map(k=>FOCUS_LABEL[k]).join(", "),note:note,count:filtered.length,total})
  .then(({findings,model,askStarters})=>{clearInterval(wiz.timer);clearInterval(wiz.mtimer);if(token!==wizRunToken)return;wiz.progress=100;state.analysis=Object.assign(base,{findings,model,askStarters:askStarters||[]});setTimeout(()=>{if(token!==wizRunToken)return;closeModal();state.view="workspace";render();},250);})
  .catch(function(e){clearInterval(wiz.timer);clearInterval(wiz.mtimer);if(token!==wizRunToken)return;const la=localAnalysis(filtered,usePicked);wiz.progress=100;state.analysis=Object.assign(base,{findings:la.findings,model:la.model,localReason:((e&&e.noKey)?"no AI key configured":"the AI service did not respond")});setTimeout(()=>{if(token!==wizRunToken)return;closeModal();state.view="workspace";render();},250);});
}

  case"chat-local":{const lq=chat.lastQ||"";const la=localChatAnswer(lq,chat.ctx)||"From the data I can answer about contracts expiring, suppliers across BUs, price variance, off-contract spend, top suppliers, or spend by business unit.";chat.msgs.push({role:"assistant",content:la,web:chat.web});renderChat();break;}
  case"chat-starter":chatSend(t.dataset.text);break;
  case"chat-refresh-starters":{var st=starterState(chat.ctx);var pool=(st&&st.source==="ai"&&st.questions&&st.questions.length)?st.questions:STARTER_POOL;starterOffset=(starterOffset+3)%pool.length;renderChat();break;}
  case"finding-followup":chat.web=false;chatSend(t.dataset.text);break;
  case"finding-followup-refresh":refreshFollowups(Number(t.dataset.idx));render();break;
  case"fmt-bold":reportExec("bold");break;
  case"fmt-italic":reportExec("italic");break;
  case"fmt-underline":reportExec("underline");break;
  case"fmt-align-left":reportExec("justifyLeft");break;
  case"fmt-align-center":reportExec("justifyCenter");break;
  case"fmt-align-right":reportExec("justifyRight");break;
  case"fmt-ul":reportExec("insertUnorderedList");break;
  case"fmt-ol":reportExec("insertOrderedList");break;
  case"fmt-clear":reportExec("removeFormat");break;
  case"wiz-win":wiz.customMode=false;wiz.win=(t.dataset.win==="all")?"all":+t.dataset.win;renderWizard();break;
  case"wiz-custom":wiz.customMode=true;renderWizard();break;
  case"wiz-next":{if(wiz.step===0){if(wiz.customMode){const d=document.getElementById("wiz-days");wiz.custom=d?d.value:wiz.custom;if(!(+wiz.custom>0))return;}wiz.step=1;}else if(wiz.step===1){if(wiz.picked.length===0&&!(wiz.note&&wiz.note.trim()))return;wiz.step=2;}renderWizard();break;}
  case"wiz-back":{wiz.step=Math.max(0,wiz.step-1);renderWizard();break;}
  case"chat-web":chatWeb=(t.dataset.web==="on");chat.web=chatWeb;renderChat();if(!chat.web&&!chat.msgs.length)ensureChatStarters();break;
  case"wiz-rmfile":removeFile(t.dataset.id);renderWizard();break;
  case"rmfile":removeFile(t.dataset.id);render();break;
  case"rm-finding":removeFinding(Number(t.dataset.idx));render();break;
  case"wiz-toggle":{const k=t.dataset.key;wiz.picked=wiz.picked.includes(k)?wiz.picked.filter(x=>x!==k):wiz.picked.concat([k]);renderWizard();break;}
  case"wiz-run":if(wiz.picked.length===0&&!(wiz.note&&wiz.note.trim()))return;wizRun();break;
 }
});
function openEntity(type,name){if(type==="supplier")openSupplier360(name);else openDrill({type,name});}
document.addEventListener("input",(e)=>{if(e.target&&e.target.id==="wiz-note")wiz.note=e.target.value;});
document.addEventListener("mouseup",(e)=>{if(e.target&&e.target.closest&&e.target.closest("#reportPage"))saveReportSelection();});
document.addEventListener("keyup",(e)=>{if(e.target&&e.target.closest&&e.target.closest("#reportPage"))saveReportSelection();});
document.addEventListener("change",(e)=>{
 if(e.target&&e.target.id==="fmtFont"){reportExec("fontName",e.target.value);return;}
 if(e.target&&e.target.id==="fmtSize"){reportExec("fontSize",e.target.value);return;}
 if(e.target&&e.target.id==="fmtColor"){reportExec("foreColor",e.target.value);return;}
 if(e.target&&e.target.id==="wsFileInput"){addFiles(e.target.files,function(){render();});e.target.value="";return;}
 if(e.target&&e.target.id==="wizFileInput"){addFiles(e.target.files,function(){renderWizard();});e.target.value="";return;}
 if(e.target&&e.target.id==="roleSel"){state.roleId=e.target.value;state.view="dashboard";state.analysis=null;state.range="all";recomputeContracts();render();}});
document.addEventListener("keydown",(e)=>{
 if(e.key==="Escape"&&modalRoot.innerHTML){cancelWizardRun();closeModal();}
 if(e.key==="Escape"){closeDlMenu();}
 if(e.key==="Enter"&&e.target&&e.target.hasAttribute&&e.target.hasAttribute("data-chat-input")){chatSend();}
});
document.addEventListener("mousedown",(e)=>{const ov=e.target.closest(".ov");if(ov&&e.target===ov){cancelWizardRun();closeModal();}});

/* ---------------- init ---------------- */
const segtip=document.createElement("div");segtip.id="segtip";document.body.appendChild(segtip);
document.addEventListener("mouseover",e=>{const sp=e.target.closest&&e.target.closest(".segpart");if(!sp)return;segtip.innerHTML="<b>"+esc(sp.dataset.name)+"</b><br>"+esc(sp.dataset.val)+" \u00b7 "+esc(sp.dataset.pct);segtip.style.display="block";});
document.addEventListener("mousemove",e=>{if(segtip.style.display!=="block")return;const sp=e.target.closest&&e.target.closest(".segpart");if(!sp){segtip.style.display="none";return;}segtip.style.left=e.clientX+"px";segtip.style.top=(e.clientY-12)+"px";});
document.addEventListener("mouseout",e=>{const sp=e.target.closest&&e.target.closest(".segpart");if(sp)segtip.style.display="none";});
recomputeContracts();
if(location.protocol==="http:"||location.protocol==="https:"){fetch("/api/health").then(function(r){return r.ok?r.json():null;}).then(function(j){if(j&&j.ok)BACKEND=true;}).catch(function(){});}
render();
