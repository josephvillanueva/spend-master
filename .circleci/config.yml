version: 2.1

parameters:
  force_full:
    type: boolean
    default: false
jobs:
  check:
    docker:
      - image: cimg/python:3.11-node
    resource_class: small
    steps:
      - checkout
      - run:
          name: Check whether full verification is needed
          environment:
            CI_DEFAULT_BRANCH: "main"
            CI_BASE_REVISION: << pipeline.git.base_revision >>
            CI_FORCE_FULL: << pipeline.parameters.force_full >>
          command: bash .circleci/should-run.sh
      - run:
          name: Check local HTML assets and JavaScript syntax
          command: python .circleci/check_static.py
workflows:
  ci:
    when:
      or:
        - << pipeline.parameters.force_full >>
        - not:
            equal: ["main", << pipeline.git.branch >>]
    jobs:
      - check
