<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 668" width="1160" height="668" role="img" aria-labelledby="t"><title id="t">Spend Master architecture</title><style>svg{--bg:#ffffff;--zone:#f5f6f8;--zoneStroke:#d5d9e0;--zoneLabel:#0a6fb8;--node:#ffffff;--nodeStroke:#c4cad3;--title:#111827;--text:#4b5563;--edge:#6b7280;--edgeText:#374151;--accent:#0a84d6;--pill:#ffffff;}@media (prefers-color-scheme: dark){svg{--bg:#0f1218;--zone:#151a23;--zoneStroke:#2a313d;--zoneLabel:#4db5ff;--node:#1b212c;--nodeStroke:#363e4c;--title:#f3f4f6;--text:#a4acb9;--edge:#8a93a2;--edgeText:#d1d5db;--accent:#4db5ff;--pill:#0f1218;}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.bg{fill:var(--bg)}
.zone{fill:var(--zone);stroke:var(--zoneStroke);stroke-width:1;stroke-dasharray:5 4}
.zlabel{fill:var(--zoneLabel);font-size:12px;font-weight:700;letter-spacing:.08em}
.zsub{fill:var(--text);font-size:12px}
.node{fill:var(--node);stroke:var(--nodeStroke);stroke-width:1.2}
.node.key{stroke:var(--accent);stroke-width:2}
.bar{fill:var(--accent)}
.ntitle{fill:var(--title);font-size:14px;font-weight:600}
.ntext{fill:var(--text);font-size:12px}
.edge{fill:none;stroke:var(--edge);stroke-width:1.5}
.edge.alt{stroke-dasharray:6 4}
.head{fill:var(--edge)}
.pill{fill:var(--pill);stroke:var(--zoneStroke);stroke-width:1}
.elabel{fill:var(--edgeText);font-size:11.5px}
.legend{fill:var(--text);font-size:12px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" width="1160" height="668" rx="14"/><rect class="zone" x="16" y="16" width="1128" height="424" rx="12"/><text class="zlabel" x="36" y="46">BROWSER</text><text class="zsub" x="36" y="66">A single HTML file. Data is generated in the page; nothing is stored on a server.</text><rect class="zone" x="16" y="464" width="1128" height="160" rx="12"/><text class="zlabel" x="36" y="494">OPTIONAL</text><text class="zsub" x="36" y="514">Only used when an AI proxy is configured. The demo runs without it.</text><path class="edge" d="M278,155.5 L348,155.5" marker-end="url(#arrow)"/><path class="edge" d="M588,155.5 L658,155.5" marker-end="url(#arrow)"/><path class="edge" d="M444,201 L444,290" marker-end="url(#arrow)"/><path class="edge" d="M552,201 L552,240 Q552,250 562,250 L720,250 Q730,250 730,260 L730,290" marker-end="url(#arrow)"/><path class="edge alt" d="M348,327 L278,327" marker-end="url(#arrow)"/><path class="edge" d="M898,327 L938,327" marker-end="url(#arrow)"/><path class="edge" d="M468,364 L468,460 Q468,470 478,470 L508,470 Q518,470 518,480 L518,530" marker-end="url(#arrow)"/><path class="edge" d="M778,364 L778,557 Q778,567 768,567 L728,567" marker-end="url(#arrow)"/><rect class="node" x="48" y="110" width="230" height="91" rx="10"/><rect class="bar" x="48" y="122" width="3" height="67" rx="1.5"/><text class="ntitle" x="64" y="137">Seeded data generator</text><text class="ntext" x="64" y="158">400 transactions, fixed seed</text><text class="ntext" x="64" y="175">7 business units, 8 categories</text><text class="ntext" x="64" y="192">External and intercompany</text><rect class="node key" x="348" y="110" width="240" height="91" rx="10"/><text class="ntitle" x="364" y="137">Role scoping</text><text class="ntext" x="364" y="158">Group head sees everything</text><text class="ntext" x="364" y="175">BU heads see their own unit</text><text class="ntext" x="364" y="192">Category manager sees IT</text><rect class="node" x="658" y="110" width="240" height="91" rx="10"/><text class="ntitle" x="674" y="137">Dashboard (Chart.js)</text><text class="ntext" x="674" y="158">Overview, business units,</text><text class="ntext" x="674" y="175">suppliers and contracts,</text><text class="ntext" x="674" y="192">trend, transactions</text><rect class="node" x="48" y="290" width="230" height="74" rx="10"/><text class="ntitle" x="64" y="317">Local analysis</text><text class="ntext" x="64" y="338">Findings computed from the</text><text class="ntext" x="64" y="355">data when no AI is set up</text><rect class="node" x="348" y="290" width="240" height="74" rx="10"/><text class="ntitle" x="364" y="317">Run analysis wizard</text><text class="ntext" x="364" y="338">Time window, focus areas,</text><text class="ntext" x="364" y="355">optional files</text><rect class="node" x="658" y="290" width="240" height="74" rx="10"/><text class="ntitle" x="674" y="317">Ask your data</text><text class="ntext" x="674" y="338">Chat over authorized rows,</text><text class="ntext" x="674" y="355">optional web mode</text><rect class="node" x="938" y="290" width="190" height="74" rx="10"/><text class="ntitle" x="954" y="317">Report builder</text><text class="ntext" x="954" y="338">Edit findings, add charts,</text><text class="ntext" x="954" y="355">AI review, PDF export</text><rect class="node" x="448" y="530" width="280" height="74" rx="10"/><text class="ntitle" x="464" y="557">LLM proxy (/api/complete)</text><text class="ntext" x="464" y="578">Not part of this repo</text><text class="ntext" x="464" y="595">Receives aggregates only</text><rect class="pill" x="294.12" y="138.5" width="37.760000000000005" height="34" rx="5"/><text class="elabel" x="313" y="152.5" text-anchor="middle">all</text><text class="elabel" x="313" y="166.5" text-anchor="middle">rows</text><rect class="pill" x="584.8" y="138.5" width="76.4" height="34" rx="5"/><text class="elabel" x="623" y="152.5" text-anchor="middle">authorized</text><text class="elabel" x="623" y="166.5" text-anchor="middle">rows</text><rect class="pill" x="402.58" y="235.5" width="82.84" height="20" rx="5"/><text class="elabel" x="444" y="249.5" text-anchor="middle">scoped rows</text><rect class="pill" x="287.68" y="310" width="50.64" height="34" rx="5"/><text class="elabel" x="313" y="324" text-anchor="middle">no AI</text><text class="elabel" x="313" y="338" text-anchor="middle">set up</text><rect class="pill" x="892.68" y="310" width="50.64" height="34" rx="5"/><text class="elabel" x="918" y="324" text-anchor="middle">add to</text><text class="elabel" x="918" y="338" text-anchor="middle">report</text><rect class="pill" x="420.14" y="400" width="95.72000000000001" height="34" rx="5"/><text class="elabel" x="468" y="414" text-anchor="middle">summary +</text><text class="elabel" x="468" y="428" text-anchor="middle">25-row sample</text><path class="edge" d="M36,642 L70,642" marker-end="url(#arrow)"/><text class="legend" x="80" y="646">Call or request (responses return the same way)</text><rect class="node key" x="425.84000000000003" y="634" width="22" height="16" rx="4"/><text class="legend" x="455.84000000000003" y="646">Core logic</text><rect class="node" x="553.0400000000001" y="634" width="22" height="16" rx="4"/><rect class="bar" x="553.0400000000001" y="637" width="3" height="10" rx="1.5"/><text class="legend" x="583.0400000000001" y="646">Generated data</text><path class="edge alt" d="M707.1200000000001,642 L741.1200000000001,642" marker-end="url(#arrow)"/><text class="legend" x="751.1200000000001" y="646">Fallback</text></svg>
